
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Bio Link Page</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Main Bio Link Section -->
    <main class="container-fluid bio-background">
        <div class="row justify-content-center align-items-center min-vh-100 py-5">

            <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">

                <div class="bio-card text-center p-4 p-md-5">

                    <!-- Profile Image -->
                    <img
                        src="https://placehold.co/150x150/6c63ff/ffffff?text=Profile"
                        alt="Profile photo"
                        class="profile-img mb-3"
                    >

                    <!-- Name and Introduction -->
                    <h1 class="fw-bold mb-2">Your Name</h1>

                    <p class="text-muted mb-3">
                        Web Design Learner | Creative Thinker
                    </p>

                    <p class="intro mb-4">
                        Welcome to my bio page! Explore my social profiles,
                        learn more about me, and feel free to connect.
                    </p>

                    <!-- Bio Links -->
                    <div class="d-grid gap-3">

                        <a href="https://www.instagram.com/"
                           target="_blank"
                           rel="noopener noreferrer"
                           class="btn bio-btn instagram">
                            Instagram
                        </a>

                        <a href="https://www.linkedin.com/"
                           target="_blank"
                           rel="noopener noreferrer"
                           class="btn bio-btn linkedin">
                            LinkedIn
                        </a>

                        <a href="https://github.com/"
                           target="_blank"
                           rel="noopener noreferrer"
                           class="btn bio-btn github">
                            GitHub
                        </a>

                        <a href="https://www.youtube.com/"
                           target="_blank"
                           rel="noopener noreferrer"
                           class="btn bio-btn youtube">
                            YouTube
                        </a>

                        <a href="mailto:yourname@example.com"
                           class="btn bio-btn contact">
                            Contact Me
                        </a>

                    </div>

                    <!-- Footer -->
                    <hr class="my-4">

                    <p class="footer-text mb-0">
                        © 2026 Your Name | All Rights Reserved
                    </p>

                </div>

            </div>
        </div>
    </main>

    <!-- Bootstrap JavaScript Bundle -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
