
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Makes the page fit the device width -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Profile Card</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page-container">

        <section class="profile-card">

            <img
                src="https://placehold.co/160x160/6c63ff/ffffff?text=Profile"
                alt="Profile picture"
                class="profile-image"
            >

            <h1>Mrugakshi Kotak</h1>

            <h3>Junior Android Developer</h3>

            <p class="description">
                I am a passionate developer who enjoys learning new
                technologies and building useful applications.
            </p>

            <div class="profile-details">
                <p><strong>Skills:</strong> Kotlin, Java, SQL</p>
                <p><strong>Experience:</strong> Android Development</p>
                <p><strong>Location:</strong> India</p>
            </div>

            <div class="button-group">
                <a href="mailto:yourname@example.com" class="btn contact-btn">
                    Contact Me
                </a>

                <a href="https://github.com/" class="btn github-btn"
                   target="_blank" rel="noopener noreferrer">
                    GitHub
                </a>
            </div>

        </section>

    </main>

</body>
</html>
